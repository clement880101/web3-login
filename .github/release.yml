# Groups the notes that `gh release create --generate-notes` writes.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels: ['breaking']
    - title: Features
      labels: ['enhancement']
    - title: Fixes
      labels: ['bug']
    - title: Documentation
      labels: ['documentation']
    - title: Dependencies
      labels: ['dependencies']
    - title: Other changes
      labels: ['*']
