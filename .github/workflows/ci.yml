name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Build site
        run: npm run build
        env:
          CI: true

      - name: Build library
        run: npm run build:lib
        env:
          CI: true

      - name: Check package contents
        run: npm pack --dry-run
