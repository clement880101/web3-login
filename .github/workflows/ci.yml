name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in engines, and current.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          CI: true

      - name: Build library
        run: npm run build:lib
        env:
          CI: true

      # Catches a file list that has drifted from what the package actually
      # needs, before a release does.
      - name: Check package contents
        run: npm pack --dry-run

  # A single stable gate for branch protection to require. The jobs above can
  # be renamed, split or extended — including the test matrix — without
  # touching the protection rule, which only ever names this one.
  verify:
    name: verify
    needs: [lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # needs.*.result is 'success', 'failure', 'cancelled' or 'skipped'.
      # Anything but success everywhere fails the gate; without this the job
      # would pass on a skipped dependency.
      - name: Check that every job succeeded
        if: contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "lint=${{ needs.lint.result }}" >&2
          echo "test=${{ needs.test.result }}" >&2
          echo "build=${{ needs.build.result }}" >&2
          exit 1

      - run: echo "All required jobs succeeded."
