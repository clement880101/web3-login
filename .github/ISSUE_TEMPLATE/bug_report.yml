name: Bug report
description: Something does not behave the way it is documented.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Security issues do not belong here — see
        [SECURITY.md](https://github.com/clement880101/web3-login/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        The steps, or a link to a minimal reproduction. Wallet state matters:
        say whether the wallet was already authorized, on which chain, and
        whether a prompt appeared.
      placeholder: |
        1. Fresh profile, MetaMask installed and locked
        2. Render <Web3Button chainId={1} />
        3. Click Connect
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code
      description: How you are rendering the button or calling the hook.
      render: jsx

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 2.0.0
    validations:
      required: true

  - type: input
    id: wallet
    attributes:
      label: Wallet and browser
      placeholder: MetaMask 12.x, Chrome 141, macOS
    validations:
      required: true

  - type: input
    id: chain
    attributes:
      label: Chain
      placeholder: Ethereum mainnet (1)

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any error, including the provider error code if there is one.
      render: text
